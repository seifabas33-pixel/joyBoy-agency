name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "anjum-dashboard.html"
      - "anjum-proposal.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The dashboard is served as the site root, so the published URL is
      # the bare repo address rather than a path ending in .html.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp anjum-dashboard.html _site/index.html
          cp anjum-proposal.html _site/proposal.html
          touch _site/.nojekyll

      # Pages has to be switched on once by hand, under
      # Settings -> Pages -> Source -> "GitHub Actions". The automatic
      # enablement option is not usable here: creating a Pages site needs
      # repo-admin rights, which the built-in GITHUB_TOKEN does not carry.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
