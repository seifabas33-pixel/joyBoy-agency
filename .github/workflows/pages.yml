name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "anjum-dashboard.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The dashboard is served as the site root, so the published URL is
      # the bare repo address rather than a path ending in .html.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp anjum-dashboard.html _site/index.html
          touch _site/.nojekyll

      # enablement:true turns Pages on via the API if it is not already on,
      # so no manual Settings step is needed when the plan allows it.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
