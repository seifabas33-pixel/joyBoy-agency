name: Deploy site to GitHub Pages

# SWITCHED OFF (2026-10-06): the live site is published from the gh-pages branch, which carries
# the WHOLE site (team portal, de/it, legal, 404, CNAME, favicon). This workflow only assembles the
# homepage + media, and once Actions became available on the account it ran on pushes to main and
# replaced the full site — /team/ went 404. Manual runs only; never re-add the push trigger.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The dashboard is served as the site root, so the published URL is
      # the bare repo address rather than a path ending in .html.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp portfolio.html _site/index.html
          cp anjum-dashboard.html _site/anjum.html
          printf '%s\n' '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Joy Boy Agency</title><meta http-equiv="refresh" content="0; url=./"><link rel="canonical" href="./"></head><body><p>Moved to <a href="./">the homepage</a>.</p></body></html>' > _site/portfolio.html
          cp -r media _site/media
          touch _site/.nojekyll

      # Pages has to be switched on once by hand, under
      # Settings -> Pages -> Source -> "GitHub Actions". The automatic
      # enablement option is not usable here: creating a Pages site needs
      # repo-admin rights, which the built-in GITHUB_TOKEN does not carry.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
